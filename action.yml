name: "AI Code Review Gate"
description: "Run deterministic AI-code risk rules and emit SARIF for GitHub Code Scanning."
inputs:
  fail-on:
    description: "Fail the run when any finding reaches this severity."
    default: "medium"
  scan-path:
    description: "Path to scan."
    default: "."
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ai-code-review-gate
      shell: bash
      run: pip install .

    - name: Run the review gate
      shell: bash
      run: |
        python -m ai_code_review_gate scan "${{ inputs.scan-path }}" \
          --format sarif --fail-on "${{ inputs.fail-on }}" \
          > ai-code-review-gate.sarif

    - name: Upload SARIF to GitHub Code Scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ai-code-review-gate.sarif
        category: ai-code-review-gate
